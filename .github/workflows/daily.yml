name: Sequoia-X Daily
# 定时任务：每个交易日北京时间 16:00 后（收盘数据就绪）自动选股并推飞书
# 北京 16:00 = UTC 08:00；GitHub cron 为 UTC、无夏令时、且不保证准点（高峰期延迟可达数小时）
# 故用 08:00-08:45 每 15 分钟多次触发兜底 + 「今日已成功」去重守卫，保证一天只跑一次。
on:
  schedule:
    - cron: "0,15,30,45 8 * * 1-5"
  workflow_dispatch: {}   # 手动触发

env:
  START_DATE: "2026-02-01"
  BACKFILL_WORKERS: "8"
  TIME_BUDGET_MIN: "40"

jobs:
  run:
    runs-on: ubuntu-24.04   # 写死，避开 2026-10-19 ubuntu-latest 自动跳 Ubuntu 26 的坑
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "baostock>=0.9" "akshare>=1.10" "pandas>=2.0" \
            "pydantic-settings>=2.0" "python-dotenv>=1.0" "rich>=13.0" "requests>=2.31"

      # 跨次运行保留 data/（含 SQLite + 成功标记），避免每次重灌
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: data
          key: sequoia-db-${{ github.run_id }}
          restore-keys: |
            sequoia-db-

      # 去重守卫：今天已成功跑过就跳过后续步骤
      - name: Guard - skip if already succeeded today
        id: guard
        run: |
          TODAY_BJ=$(TZ=Asia/Shanghai date +%F)
          if [ -f data/.last_success ] && [ "$(cat data/.last_success)" = "$TODAY_BJ" ]; then
            echo "skip=1"
            echo "今日($TODAY_BJ)已成功执行，跳过"
          else
            echo "skip=0"
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      # 只把已配置的 webhook 写进 .env；未设置的策略自动回退到默认机器人
      - name: Prepare .env from secrets
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          STRATEGY_WEBHOOK_MA_VOLUME: ${{ secrets.STRATEGY_WEBHOOK_MA_VOLUME }}
          STRATEGY_WEBHOOK_TURTLE: ${{ secrets.STRATEGY_WEBHOOK_TURTLE }}
          STRATEGY_WEBHOOK_FLAG: ${{ secrets.STRATEGY_WEBHOOK_FLAG }}
          STRATEGY_WEBHOOK_SHAKEOUT: ${{ secrets.STRATEGY_WEBHOOK_SHAKEOUT }}
          STRATEGY_WEBHOOK_LIMIT_DOWN: ${{ secrets.STRATEGY_WEBHOOK_LIMIT_DOWN }}
          STRATEGY_WEBHOOK_RPS: ${{ secrets.STRATEGY_WEBHOOK_RPS }}
          STRATEGY_WEBHOOK_PRIVATE_PLACEMENT: ${{ secrets.STRATEGY_WEBHOOK_PRIVATE_PLACEMENT }}
        run: |
          : > .env
          for v in FEISHU_WEBHOOK_URL STRATEGY_WEBHOOK_MA_VOLUME STRATEGY_WEBHOOK_TURTLE \
                   STRATEGY_WEBHOOK_FLAG STRATEGY_WEBHOOK_SHAKEOUT STRATEGY_WEBHOOK_LIMIT_DOWN \
                   STRATEGY_WEBHOOK_RPS STRATEGY_WEBHOOK_PRIVATE_PLACEMENT; do
            val="$(printenv "$v" || true)"
            if [ -n "$val" ]; then
              echo "$v=$val" >> .env
            fi
          done
          echo "START_DATE=${START_DATE:-2026-02-01}" >> .env
          echo "--- .env 已写入，共 $(grep -c '=' .env || true) 个 key ---"

      # DB 缺失/不全时并行回填；回填失败则删半截 DB，下次重来（破解「DB 已存在就永远跳过回填」）
      - name: Run (backfill if needed, then daily screening)
        if: steps.guard.outputs.skip != '1'
        run: |
          mkdir -p data
          # ---- 诊断探针（失败排查用，平时也无害）----
          echo "::group::diagnostics"
          python -V
          python -c "import akshare, baostock; print('akshare', akshare.__version__); print('baostock', baostock.__version__)" || echo "::error:: import akshare/baostock 失败"
          echo "测试 akshare 境内数据源连通性..."
          python - <<'PY' || echo "::error:: akshare 连通性异常（GitHub 北美 runner 常拉不到境内数据）"
          import akshare as ak
          df = ak.stock_zh_a_spot_em()
          print("akshare spot rows:", len(df))
          PY
          echo "::endgroup::"
          # ---- 正式流程 ----
          if [ ! -f data/sequoia_v2.db ]; then
            echo "未检测到数据库，先并行回填（受 TIME_BUDGET_MIN 限制，可续传）..."
            python -u tools/fast_backfill.py || { echo "回填失败，清理半截 DB"; rm -f data/sequoia_v2.db; exit 1; }
          fi
          echo "执行日常选股..."
          python -u main.py
          TZ=Asia/Shanghai date +%F > data/.last_success
          echo "已写入成功标记 data/.last_success"
