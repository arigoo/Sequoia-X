name: Sequoia-X Backfill

# 手动触发：首次部署或换库时，一次性灌入全市场历史 K 线（约 12 分钟）
# 入口：仓库 Actions 标签页 → Sequoia-X Backfill → Run workflow
on:
  workflow_dispatch: {}

env:
  # 策略最大历史需求 = RPS 的 120 根 K 线（约 6 个月交易日），
  # 给 8 个月余量；比仓库默认 2024-01-01 少拉 4 倍数据。
  START_DATE: "2026-02-01"
  BACKFILL_WORKERS: "8"
  TIME_BUDGET_MIN: "45"

jobs:
  backfill:
    runs-on: ubuntu-latest
    # 单 job 硬上限 6h；脚本内 45min 会主动优雅退出并保存 cache，
    # 没跑完就再 Run 一次自动续传。
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "baostock>=0.9" "akshare>=1.10" "pandas>=2.0" \
                      "pydantic-settings>=2.0" "python-dotenv>=1.0" "rich>=13.0" "requests>=2.31"

      # 注意：cache key 必须带 run_id。固定 key 一旦保存就无法覆盖，
      # 后续进度会存不进去；restore-keys 保证每次拿到最近一次的数据库。
      - name: Restore SQLite cache
        uses: actions/cache@v4
        with:
          path: data/sequoia_v2.db
          key: sequoia-db-${{ github.run_id }}
          restore-keys: |
            sequoia-db-

      - name: Prepare .env from secrets
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          STRATEGY_WEBHOOK_MA_VOLUME: ${{ secrets.STRATEGY_WEBHOOK_MA_VOLUME }}
          STRATEGY_WEBHOOK_TURTLE: ${{ secrets.STRATEGY_WEBHOOK_TURTLE }}
          STRATEGY_WEBHOOK_FLAG: ${{ secrets.STRATEGY_WEBHOOK_FLAG }}
          STRATEGY_WEBHOOK_SHAKEOUT: ${{ secrets.STRATEGY_WEBHOOK_SHAKEOUT }}
          STRATEGY_WEBHOOK_LIMIT_DOWN: ${{ secrets.STRATEGY_WEBHOOK_LIMIT_DOWN }}
          STRATEGY_WEBHOOK_RPS: ${{ secrets.STRATEGY_WEBHOOK_RPS }}
          STRATEGY_WEBHOOK_PRIVATE_PLACEMENT: ${{ secrets.STRATEGY_WEBHOOK_PRIVATE_PLACEMENT }}
        run: |
          : > .env
          # 注意：不能用 `[ -n "$X" ] && echo ...` —— Actions 用 bash -e 执行，
          # 变量为空时该表达式整体返回 1，会直接判定步骤失败。改用 if，恒返回 0。
          for v in FEISHU_WEBHOOK_URL STRATEGY_WEBHOOK_MA_VOLUME STRATEGY_WEBHOOK_TURTLE \
                   STRATEGY_WEBHOOK_FLAG STRATEGY_WEBHOOK_SHAKEOUT STRATEGY_WEBHOOK_LIMIT_DOWN \
                   STRATEGY_WEBHOOK_RPS STRATEGY_WEBHOOK_PRIVATE_PLACEMENT; do
            val="$(printenv "$v" || true)"
            if [ -n "$val" ]; then
              echo "$v=$val" >> .env
            fi
          done
          echo "--- .env 已写入，共 $(grep -c '=' .env || true) 个 key ---"

      # 不使用 main.py --backfill：它是单线程串行，海外 runner 上约 14 只/分钟，
      # 5224 只需 5~6h 会撞 6h 上限。改用并行脚本，未完成可重跑续传。
      - name: Parallel backfill (resumable)
        run: |
          mkdir -p data
          python tools/fast_backfill.py
